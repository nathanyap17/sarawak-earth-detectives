[project]
name = "sed-backend"
version = "0.1.0"
description = "Sarawak Earth Detectives backend: Data Vault, analysis, sessions and ADK agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "xarray>=2024.6",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pymannkendall>=1.4.3",
    "scikit-learn>=1.5",
    "ruptures>=1.1.9",
    "google-adk==2.14.1",
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.17",
    "firebase-admin>=6.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ml = ["xgboost>=2.1"]
geo = ["geopandas>=1.0", "shapely>=2.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
